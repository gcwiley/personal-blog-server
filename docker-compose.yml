# Local testing setup for the Google SSO flow via OAuth2 Proxy. This does NOT
# represent production (Cloud Run uses deploy/service.yaml instead) — it's here so
# you can click through the full sign-in flow on your machine before deploying.
#
# Usage (run from this directory, personal-blog-server/):
#   1. Build the client first — this Dockerfile does not build it for you:
#        (cd ../personal-blog-client && npm run build-move)
#   2. cp .env.oauth2-proxy.example .env.oauth2-proxy and fill in real values
#   3. Add http://localhost:4180/oauth2/callback as an authorized redirect URI on
#      your Google OAuth 2.0 Client ID
#   4. docker compose up --build
#   5. Visit http://localhost:4180 (NOT localhost:3000 — that bypasses the proxy)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # must stay non-production here: the session cookie's `Secure` flag is tied to
      # NODE_ENV, and OAuth2 Proxy is also running over plain HTTP in this local setup
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:4180
    expose:
      - '3000'
    networks: [blog]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    depends_on: [app]
    env_file:
      - .env.oauth2-proxy
    environment:
      - OAUTH2_PROXY_PROVIDER=google
      - OAUTH2_PROXY_UPSTREAMS=http://app:3000/
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REDIRECT_URL=http://localhost:4180/oauth2/callback
      # plain HTTP locally — Cloud Run config sets this true behind TLS
      - OAUTH2_PROXY_COOKIE_SECURE=false
      - OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE=/etc/oauth2-proxy/authenticated-emails.txt
      # skips OAuth2 Proxy's own provider-chooser page — the app's /signin page is
      # the single entry point, and there's only one provider configured anyway
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      # requests under /api get a clean 401 instead of a redirect-to-Google when the
      # session is missing/expired, so the Angular interceptor can handle it cleanly
      - OAUTH2_PROXY_API_ROUTES=^/api
      - OAUTH2_PROXY_PASS_USER_HEADERS=true
    volumes:
      - ./oauth2-proxy/authenticated-emails.txt:/etc/oauth2-proxy/authenticated-emails.txt:ro
    ports:
      - '4180:4180'
    networks: [blog]

networks:
  blog:
